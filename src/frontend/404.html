<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 500px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #002349;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      color: #002349;
      margin: 0 0 0.5rem;
    }
    p {
      color: #666;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Redirecting...</h1>
    <p>Taking you to the right page.</p>
  </div>

  <script>
    (function() {
      // Get the current path
      const path = window.location.pathname;
      
      // Remove any base path if hosted under a subdirectory
      const segments = path.split('/').filter(s => s);
      const lastSegment = segments[segments.length - 1] || '';
      
      // Map clean paths to their .html equivalents
      const pathMap = {
        'about': 'about.html',
        'product-offerings': 'product-offerings.html',
        'gdpr': 'gdpr.html',
        'why-choose-us': 'why-choose-us.html',
        'contact': 'contact.html',
        'disclaimer': 'disclaimer.html'
      };
      
      // Check if the last segment matches a clean path
      if (pathMap[lastSegment]) {
        // Redirect to the .html version
        const newPath = pathMap[lastSegment];
        window.location.replace(newPath);
      } else if (lastSegment === '' || lastSegment === 'index') {
        // Redirect to home
        window.location.replace('index.html');
      } else {
        // Unknown path, redirect to home after a short delay
        setTimeout(function() {
          window.location.replace('index.html');
        }, 2000);
      }
    })();
  </script>
</body>
</html>
